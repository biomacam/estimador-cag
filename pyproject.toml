[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.7.0",
    "asyncpg>=0.29",
    "faker>=24.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.16,<2",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=2,<3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2,<3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pgvector>=0.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "redisvl>=0.3",
    # The Spanish model must match spaCy's minor version (3.8.x).
    "spacy>=3.8,<3.9",
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.4.11",
    "streamlit>=1.64.0",
    "structlog",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.52.4",
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "nltk>=3.9",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "fpdf2>=2.7",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
