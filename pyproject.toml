[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "structlog",
    "uvicorn[standard]>=0.52.4",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]