# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image.
    volumes:
      - ./app:/app/app

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack bundles RediSearch, required by the redisvl semantic cache.
    # Vanilla redis:7-alpine does NOT ship this module.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  streamlit:
    build: .
    container_name: estimator-streamlit
    ports:
      - "8501:8501"

    env_file:
      - .env

    # Reach the estimator over the compose network, not localhost (the .env
    # default is meant for running streamlit_app.py outside Docker).
    environment:
      ESTIMATOR_API_BASE_URL: http://estimator:8000

    depends_on:
      estimator:
        condition: service_healthy

    # Bind-mount the client script so edits are reflected without rebuilding,
    # same hot-reload pattern used for the estimator's ./app mount above.
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py

    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis_data:
