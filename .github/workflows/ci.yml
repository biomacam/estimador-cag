name: Run Tests

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      # Dummy value: Settings requires at least one key to be set, but tests
      # mock every LLM call, so no real provider request is ever made.
      OPENAI_API_KEY: "test-key-for-ci"

    steps:

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Instalar dependencias
      run: |
        pip install -e .
        pip install pytest fakeredis

    - name: Ejecutar tests
      run: |
        pytest  