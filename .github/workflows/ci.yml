name: Run Tests

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      # Dummy value: keeps is_llm_configured/llm_configured true-ish for tests that
      # don't override Settings; every LLM call is mocked, so it's never actually used.
      OPENAI_API_KEY: "test-key-for-ci"

    steps:

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Instalar uv
      uses: astral-sh/setup-uv@v6

    - name: Instalar dependencias
      run: uv sync --locked --all-groups

    - name: Ejecutar tests
      run: uv run pytest  